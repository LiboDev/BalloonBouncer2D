<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1f3a" />
  <title>Balloon Bouncer</title>
  <link rel="icon" href="favicon.ico" />
  <link rel="stylesheet" href="style.css" />
  <!-- For YouTube Playables, load the SDK before any game code:
  <script src="https://www.youtube.com/game_api/v1"></script> -->
</head>
<body>
  <div id="stage">
    <canvas id="game" aria-label="Balloon Bouncer game area"></canvas>

    <div id="hud" class="hidden">
      <div class="hud-top">
        <button class="icon-btn" id="btn-settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" width="44" height="44" aria-hidden="true" focusable="false">
            <g fill="currentColor">
              <rect x="10" y="1" width="4" height="6" rx="1" />
              <rect x="10" y="1" width="4" height="6" rx="1" transform="rotate(45 12 12)" />
              <rect x="10" y="1" width="4" height="6" rx="1" transform="rotate(90 12 12)" />
              <rect x="10" y="1" width="4" height="6" rx="1" transform="rotate(135 12 12)" />
              <rect x="10" y="1" width="4" height="6" rx="1" transform="rotate(180 12 12)" />
              <rect x="10" y="1" width="4" height="6" rx="1" transform="rotate(225 12 12)" />
              <rect x="10" y="1" width="4" height="6" rx="1" transform="rotate(270 12 12)" />
              <rect x="10" y="1" width="4" height="6" rx="1" transform="rotate(315 12 12)" />
              <path fill-rule="evenodd" d="M12 4.5a7.5 7.5 0 1 1 0 15 7.5 7.5 0 0 1 0-15zm0 4.3a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4z" />
            </g>
          </svg>
        </button>
        <div class="pill coin" id="hud-money" aria-label="Coins">0</div>
      </div>
    </div>

    <div id="hint" class="hint hidden">Drag back &amp; release to fling</div>

    <div id="overlay-settings" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="panel small">
        <h2 id="settings-title">Paused</h2>
        <p class="sub" id="settings-level">Level 1</p>
        <button class="btn secondary" id="btn-sound" aria-pressed="true">Sound: On</button>
        <button class="btn secondary" id="btn-speed">Speed 1&times;</button>
        <button class="btn primary" id="btn-resume">Resume</button>
      </div>
    </div>

    <div id="overlay-title" class="overlay">
      <div class="panel">
        <h1>Balloon<br />Bouncer</h1>
        <p class="tagline">Fling once. Watch everything pop.</p>
        <button class="btn primary" id="btn-play">Play</button>
      </div>
    </div>

    <div id="overlay-results" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="res-title">
      <div class="panel">
        <h2 id="res-title">Nice!</h2>
        <p id="res-sub"></p>
        <div class="pill coin big" id="res-earned" aria-label="Coins earned">+0</div>
        <button class="btn primary" id="btn-to-shop">Next</button>
      </div>
    </div>

    <div id="overlay-shop" class="overlay hidden">
      <div class="panel">
        <h2>Shop</h2>
        <div class="pill coin big" id="shop-money">0</div>
        <div id="shop-list" class="shop-list"></div>
        <button class="btn primary" id="btn-next">Play next level</button>
      </div>
    </div>
  </div>

  <script src="src/platform.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
